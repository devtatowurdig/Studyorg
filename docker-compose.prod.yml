services:
  postgres:
    # Production database image has the healthcheck script baked in.
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: study-org-postgres:${APP_VERSION:-latest}
    container_name: study-org-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    # Production API image. No bind mounts are used.
    build:
      context: ./study-org-backend
      dockerfile: Dockerfile
      target: runtime
    image: study-org-backend:${APP_VERSION:-latest}
    container_name: study-org-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      API_PORT: ${API_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-4200}
    ports:
      - "${API_PUBLIC_PORT:-3071}:3000"

  frontend:
    # Production Angular image served by a minimal Node.js static server.
    # No bind mounts are used.
    build:
      context: ./study-org
      dockerfile: Dockerfile
      target: runtime
    image: study-org-frontend:${APP_VERSION:-latest}
    container_name: study-org-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: ${API_URL:-http://studyorg.frameworksenac.com.br:3071}
    ports:
      - "${FRONTEND_PORT:-4200}:4200"

volumes:
  postgres_data:
