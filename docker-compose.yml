services:
  postgres:
    # Development database with a named volume so data survives restarts.
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: study-org-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  backend:
    # Uses the production Dockerfile but overrides command/volumes for hot reload.
    build:
      context: ./study-org-backend
      dockerfile: Dockerfile
      target: runtime
    container_name: study-org-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      API_PORT: ${API_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      # Bind mount enables hot reload while named volumes protect container deps.
      - ./study-org-backend:/app
      - backend_node_modules:/app/node_modules
      - backend_generated:/app/generated
    command: sh -c "npm run prisma:generate && npm run prisma:push && npm run dev"
    healthcheck:
      test: ["CMD", "sh", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    # Dev server image for Angular hot reload.
    image: node:22-alpine
    container_name: study-org-frontend-dev
    working_dir: /app
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      # Bind mount enables Angular hot reload while node_modules stays in Docker.
      - ./study-org:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --port 4200"
    healthcheck:
      test: ["CMD", "sh", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres_data_dev:
  backend_node_modules:
  backend_generated:
  frontend_node_modules:
